[pytest]
# wb is the package directory, tests is the test directory. A build runs "pytest tests", so
# without wb the doctests would be skipped. A local run takes its paths from this line, so
# without tests the test directory would be skipped.
# no:cacheprovider stops pytest from creating a .pytest_cache directory. During a build pytest
# works inside the directory that becomes the package, so that cache would end up in the deb.
addopts = -v -p no:cacheprovider --doctest-modules wb tests

# Adds the project root to sys.path, otherwise "import wb" fails. The pytest command does not add
# the current directory on its own, unlike "python -m pytest". The path is relative to this file,
# which pybuild copies into the build directory.
pythonpath = .

# wb has no __init__.py, it is a namespace directory. Without this option pytest imports the
# modules for doctests without the "wb." prefix, and then __name__ and __package__ come out wrong.
consider_namespace_packages = true

asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
